# XcodeGen spec — run `xcodegen generate`, then open AMSSeedboard.xcodeproj.
# ONE target for iPhone, iPad and Mac.
name: AMSSeedboard
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # The version lives here only; the Info.plist reads it from these two.
    MARKETING_VERSION: "0.8"
    CURRENT_PROJECT_VERSION: "8"
packages:
  # The rules: boards, layout, arrows, text in and out, what goes to PARAGON. No screen in it.
  SeedboardCore:
    path: Core
  # The shared AMS icon hub, pinned to one commit so a hub change never arrives by surprise.
  AMSIcons:
    url: https://github.com/marsch124/AMS-Icons
    revision: 8e79eafd54b040b9e96fe07e3abae3e7d85157dc
targets:
  AMSSeedboard:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: SeedboardCore
      - package: AMSIcons
      # 0.5: Share › Seedboard, embedded in the app on iPhone, iPad and Mac.
      - target: AMSSeedboardShare
    entitlements:
      path: App/Config/AMSSeedboard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # 0.5: printing a board (the Mac's sandbox asks for it).
        com.apple.security.print: true
        com.apple.developer.icloud-services: [CloudDocuments]
        # Seedboard's own container first; PARAGON's second, so a board can be handed over.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.schabbauer.AMSSeedboard, iCloud.com.schabbauer.AMSPara]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.schabbauer.AMSSeedboard, iCloud.com.schabbauer.AMSPara]
        # PARAGON's shared folder: Inbox lines wait there until PARAGON files them (iPhone and iPad spelling).
        com.apple.security.application-groups: [group.com.schabbauer.amspara]
    settings:
      base:
        # The Mac spells the same shared folder with the Team ID in front, so it has its own file.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Config/AMSSeedboard-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: true
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSSeedboard
        # iPhone AND iPad. iPad means all four orientations (upload error 90474).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: Seedboard
        CFBundleName: AMS Seedboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.schabbauer.AMSSeedboard
            CFBundleURLSchemes: [seedboard]
            CFBundleTypeRole: Viewer
        # iPad with a trackpad or mouse: clicks arrive as pointer touches, scrolling and pinching as their own events.
        UIApplicationSupportsIndirectInputEvents: true
        # 0.5: glides and landings run at the screen's full 120 frames a second on an iPhone Pro.
        CADisableMinimumFrameDurationOnPhone: true
        # 0.5: a board open on one device offers itself on the others (Handoff).
        NSUserActivityTypes: [com.schabbauer.AMSSeedboard.board]
        # 0.5: a photo straight onto a board (iPhone and iPad), and a photo or scan from the iPhone on the Mac.
        NSCameraUsageDescription: To put a photo straight onto a board.
        # 0.5, the Mac: words marked in another app become a board (right-click ▸ Services). `MacDelegate` answers.
        # The empty NSRequiredContext makes the line show without being switched on in System Settings first.
        NSServices:
          - NSMenuItem:
              default: New Seedboard Board from Selection
            NSMessage: newBoardFromSelection
            NSPortName: AMSSeedboard
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
        # So the app may ask whether PARAGON is installed.
        LSApplicationQueriesSchemes: [amspara]
        NSUbiquitousContainers:
          iCloud.com.schabbauer.AMSSeedboard:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Seedboard
            NSUbiquitousContainerSupportedFolderLevels: Any
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  # 0.5: Share › Seedboard. ONE target and ONE bundle id for iPhone, iPad and Mac. It takes words, a link and
  # pictures from any app's Share button and only ever writes into the waiting place (ArrivalBox); the app lays
  # the things on their board the next time it is in front.
  AMSSeedboardShare:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Share
      # The two files the app and the share page have in common: the waiting place and the page itself.
      - path: App/Sources/ArrivalBox.swift
      - path: App/Sources/ShareInPage.swift
    dependencies:
      - package: SeedboardCore
      - package: AMSIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSSeedboard.Share
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
        INFOPLIST_FILE: App/Config/Share/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Hand-written files (not made from this spec), so the app-group block in each can be deleted by hand.
        CODE_SIGN_ENTITLEMENTS: App/Config/Share/AMSSeedboardShare.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Config/Share/AMSSeedboardShare-macOS.entitlements
    info:
      path: App/Config/Share/Info.plist
      properties:
        CFBundleDisplayName: Seedboard
        CFBundleName: AMS Seedboard Share
        # The same two settings as the app: Apple refuses an upload whose share page has another version or build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
  AMSSeedboardUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: AMSSeedboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSSeedboardUITests
        TEST_TARGET_NAME: AMSSeedboard
schemes:
  AMSSeedboard:
    build:
      targets:
        AMSSeedboard: all
    test:
      targets:
        - AMSSeedboardUITests
        - package: SeedboardCore/SeedboardCoreTests
