<title>Seedboard Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Seedboard Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Based on AMS Seedboard 0.6. Update this tour in the release that changes a taught screen. */
:root {
  --bg: #F2F7F6; --panel: #FFFFFF; --fg: #14292A; --muted: #587070; --line: #D9E5E3;
  --accent: #17797A; --accent-soft: #DDF0EE; --good: #2F7D32; --good-soft: #E6F3E6; --warn: #A8431A;
  --shadow: 0 18px 40px rgba(20,41,42,.2);
  --teal: #1F8A8A; --para: #7C5CD6; --paraD: #6A49C4; --green: #2FA35A; --red: #D4493E; --amber: #E0A030;
  --b1: #E0578B; --b2: #E8812F; --b3: #1F8A8A; --b4: #3B7DDD; --b5: #7C5CD6; --b6: #2FA35A;
  --pbg: #F2F2F7; --pcard: #FFFFFF; --pink: #1C1C1E; --pmuted: #6C6C70; --pline: #E0E0E5; --pglass: rgba(255,255,255,.9); --pfield: rgba(120,120,128,.14);
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0F1B1B; --panel:#192727; --fg:#EAF4F2; --muted:#9DB5B2; --line:#2A3D3C;
  --accent:#4FC3C0; --accent-soft:#1B3433; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --teal:#3FBFBF; --para:#A58BF0; --paraD:#7C5CD6; --green:#4CC27D; --red:#F2766C; --amber:#F0B85A;
  --b1:#F277A4; --b2:#F29A55; --b3:#3FBFBF; --b4:#6CA0F2; --b5:#A58BF0; --b6:#4CC27D;
  --pbg:#0E0E10; --pcard:#1C1C1F; --pink:#F2F2F7; --pmuted:#9A9AA0; --pline:#333338; --pglass:rgba(40,40,44,.9); --pfield:rgba(120,120,128,.3);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#0F1B1B; --panel:#192727; --fg:#EAF4F2; --muted:#9DB5B2; --line:#2A3D3C;
  --accent:#4FC3C0; --accent-soft:#1B3433; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --teal:#3FBFBF; --para:#A58BF0; --paraD:#7C5CD6; --green:#4CC27D; --red:#F2766C; --amber:#F0B85A;
  --b1:#F277A4; --b2:#F29A55; --b3:#3FBFBF; --b4:#6CA0F2; --b5:#A58BF0; --b6:#4CC27D;
  --pbg:#0E0E10; --pcard:#1C1C1F; --pink:#F2F2F7; --pmuted:#9A9AA0; --pline:#333338; --pglass:rgba(40,40,44,.9); --pfield:rgba(120,120,128,.3);
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--teal); color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #17797A; border-color: #17797A; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pink); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
.stage button { font: inherit; color: inherit }
.stage input { font: inherit; color: var(--pink); -webkit-user-select: text; user-select: text }
.sbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; z-index: 40; pointer-events: none; background: linear-gradient(var(--pbg) 70%, transparent) }
.sbar .bat { width: 25px; height: 12px; border: 1.5px solid var(--pink); border-radius: 4px; position: relative; opacity: .8 }
.sbar .bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: var(--pink); border-radius: 2px }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 46px 16px 150px; scrollbar-width: none }
.scr::-webkit-scrollbar { display: none }
.hind { position: absolute; bottom: 8px; left: 50%; width: 130px; height: 5px; border-radius: 3px; background: var(--pink); opacity: .45; transform: translateX(-50%); z-index: 5 }
.dock { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; background: var(--pglass); border: 1px solid var(--pline); border-radius: 18px; padding: 3px 12px; z-index: 80; box-shadow: 0 4px 14px rgba(0,0,0,.2) }
.dkS, .dkP { width: 36px; height: 36px; border-radius: 9px; border: 0; display: grid; place-items: center; color: #fff; cursor: pointer }
.dkS { background: var(--teal) } .dkP { background: var(--para) }
.dkS svg, .dkP svg { width: 22px; height: 22px }

/* List (iPhone home of Seedboard) */
.hd { display: flex; align-items: center; min-height: 44px }
.hd h1 { margin: 0; font-size: 31px; line-height: 1.1; font-weight: 700; flex: 1; color: var(--teal) }
.grp { margin: 14px 0 4px; font-weight: 700; font-size: 13px; color: var(--pmuted) }
.card { background: var(--pcard); border: 1px solid var(--pline); border-radius: 12px; overflow: hidden }
.brow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 6px 12px; border: 0; background: none; text-align: left; cursor: pointer }
.brow + .brow { border-top: 1px solid var(--pline) }
.dotc { width: 12px; height: 12px; border-radius: 50%; flex: none }
.bn { font-weight: 600; font-size: 16px; display: block }
.bi { color: var(--pmuted); font-size: 12px; display: block }
.thumb { width: 44px; height: 32px; border-radius: 6px; border: 1px solid var(--pline); background: var(--pbg); flex: none; display: grid; place-items: center; color: var(--pmuted) }
.thumb svg { width: 20px; height: 20px }
.none { color: var(--pmuted); text-align: center; margin: 24px 0 }
.lbar { position: absolute; left: 12px; right: 12px; bottom: 66px; display: flex; gap: 8px; align-items: center; z-index: 20 }
.sfield { flex: 1; display: flex; align-items: center; gap: 8px; min-height: 46px; border-radius: 23px; background: var(--pglass); border: 1px solid var(--pline); padding: 0 14px; color: var(--pmuted) }
.sfield svg { width: 18px; height: 18px }
.sfield input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; min-width: 0 }
.plusb { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--green); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.25) }
.plusb svg { width: 24px; height: 24px; stroke-width: 2.4 }
.setl { position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; gap: 10px; border: 0; background: none; color: var(--pmuted); font-size: 12px; cursor: pointer; width: 100%; z-index: 19 }

/* Sheets */
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 50 }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 34px; border-radius: 22px 22px 0 0; background: var(--pbg); z-index: 55; overflow: hidden; box-shadow: 0 -8px 30px rgba(0,0,0,.3) }
.sheet .scr { padding-top: 12px; padding-bottom: 40px }
.top { display: flex; align-items: center; gap: 8px; min-height: 44px }
.top .t { flex: 1; text-align: center; font-weight: 700; font-size: 17px }
.hb { border: 0; background: none; font-weight: 600; font-size: 16px; cursor: pointer; padding: 6px 4px; border-radius: 8px; color: var(--teal) }
.hb.fill { color: #fff; padding: 6px 14px; border-radius: 16px; background: var(--teal) }
.hd2 { font-weight: 700; font-size: 14px; margin: 12px 0 5px; color: var(--pmuted) }
.stgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.stc { border: 1px solid var(--pline); background: var(--pcard); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left }
.stc .pic { height: 62px; border-radius: 8px; background: var(--pbg); display: grid; place-items: center; color: var(--teal) }
.stc .pic svg { width: 34px; height: 34px }
.stc b { font-size: 14px }
.pills { display: flex; gap: 6px; flex-wrap: wrap }
.note { color: var(--pmuted); font-size: 12.5px; margin: 4px 0 }
.shrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; border: 0; background: none; padding: 0 12px; cursor: pointer; text-align: left }
.shrow + .shrow { border-top: 1px solid var(--pline) }
.ring { width: 22px; height: 22px; border-radius: 50%; border: 1.8px solid var(--pmuted); display: grid; place-items: center; flex: none; color: #fff }
.ring svg { width: 14px; height: 14px; stroke-width: 2.6 }
.ring.on { background: var(--teal); border-color: var(--teal) }
.bigb { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 48px; border: 0; border-radius: 12px; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; background: var(--green) }
.sq { width: 44px; height: 44px; border-radius: 8px; background: var(--pcard); border: 1px solid var(--pline); display: grid; place-items: center; color: var(--pmuted) }
.apps { display: flex; gap: 14px; padding: 4px 2px }
.app { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; font-size: 11px; cursor: pointer; width: 62px }
.app .ai { width: 54px; height: 54px; border-radius: 13px; display: grid; place-items: center; color: #fff; background: #8E8E93 }
.app .ai svg { width: 26px; height: 26px }

/* Board */
.tb { position: absolute; left: 0; right: 0; top: 44px; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; z-index: 10 }
.tbn { flex: 1; text-align: center; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.link { border: 0; background: none; color: var(--teal); font-weight: 600; font-size: 15px; display: flex; align-items: center; cursor: pointer; padding: 6px 0 }
.link svg { width: 20px; height: 20px }
.ib { border: 0; background: none; color: var(--teal); padding: 6px; display: grid; cursor: pointer }
.ib svg { width: 22px; height: 22px }
.sendb { border: 0; border-radius: 16px; background: var(--paraD); color: #fff; font-weight: 600; font-size: 14px; min-height: 32px; padding: 0 14px; cursor: pointer; display: flex; align-items: center; gap: 4px }
.ctx { position: absolute; left: 12px; right: 12px; top: 92px; min-height: 40px; border-radius: 12px; background: var(--pcard); border: 1px solid var(--pline); display: flex; align-items: center; gap: 2px; padding: 3px 6px; z-index: 12; box-shadow: 0 4px 14px rgba(0,0,0,.12); overflow: hidden }
.ctx .cd { flex: 1; font-size: 12px; font-weight: 600; color: var(--pmuted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px }
.cb { border: 0; background: none; font-weight: 600; font-size: 13px; padding: 6px 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 4px; color: var(--cc, var(--teal)); white-space: nowrap }
.cb svg { width: 16px; height: 16px }
.cb.fillb { background: var(--cc, var(--teal)); color: #fff }
.cv { position: absolute; left: 16px; top: 136px; width: 358px; height: 470px; transform-origin: 0 0 }
.cvw { position: absolute; inset: 0; pointer-events: none }
.idea { position: absolute; height: 22px; line-height: 22px; font-size: 14px; font-weight: 600; white-space: nowrap; border: 0; background: none; padding: 0 2px; text-align: left; cursor: pointer; color: var(--pink); border-radius: 4px }
.idea.sel { outline: 2px solid var(--green) }
.idea.grey { color: var(--pmuted) }
.idea input { width: 100%; border: 0; border-bottom: 2px solid var(--green); background: none; outline: none; font-size: 14px; font-weight: 600; height: 22px }
.mmc { position: absolute; left: 0; width: 100px; height: 40px; border-radius: 12px; background: var(--teal); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; border: 0 }
.mk { position: absolute; right: -9px; top: -7px; width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; color: #fff }
.mk svg { width: 9px; height: 9px; stroke-width: 3 }
.mk-ring { border: 2px solid var(--para); background: var(--pbg) }
.mk-sent { background: var(--para) }
.mk-done { background: var(--green) }
.mk-cancel { background: #8E8E93 }
.stk { position: absolute; width: 112px; min-height: 52px; padding: 6px 8px; border-radius: 4px; background: #F7E27A; color: #3A3200; font-size: 12px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.2) }
.stk.sel, .pict.sel { outline: 2px solid var(--green) }
.pict { position: absolute; width: 112px; height: 80px; border-radius: 6px; background: var(--pcard); border: 1px solid var(--pline); display: grid; place-items: center; color: var(--pmuted) }
.pict svg { width: 28px; height: 28px }
.urdo { position: absolute; left: 12px; bottom: 124px; display: flex; gap: 2px; z-index: 10 }
.tools { position: absolute; left: 12px; right: 12px; bottom: 52px; height: 52px; display: flex; justify-content: space-between; align-items: center; background: var(--pglass); border: 1px solid var(--pline); border-radius: 16px; padding: 0 6px; z-index: 10 }
.tools button { border: 0; background: none; width: 36px; height: 44px; display: grid; place-items: center; color: var(--teal); cursor: pointer; padding: 0 }
.tools button svg { width: 22px; height: 22px }
.tools.tlt button { width: auto; flex: 1; display: flex; flex-direction: column; gap: 1px; font-size: 11px; font-weight: 600; justify-content: center }
.tools.tlt button svg { width: 20px; height: 20px }
.menu { position: absolute; z-index: 70; right: 12px; top: 90px; background: var(--pcard); border: 1px solid var(--pline); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.3); min-width: 220px; overflow: hidden }
.menu button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 10px 14px; font-size: 15px; cursor: pointer }
.menu button + button { border-top: 1px solid var(--pline) }

/* Timeline */
.tlWrap { position: absolute; left: 16px; top: 136px; width: 358px }
.tlLine { font-size: 11.5px; font-weight: 600; min-height: 20px }
.tlLine .lt { color: var(--red) }
.tlHead { position: relative; height: 22px; margin-left: 92px; border-bottom: 1px solid var(--pline); font-size: 11px; color: var(--pmuted) }
.tlHead span { position: absolute; top: 3px }
.tlBody { position: relative }
.tlRow { display: flex; align-items: center; width: 100%; height: 34px; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; border-bottom: 1px solid var(--pline) }
.tlRow.isSel { background: rgba(31,138,138,.14) }
.tlName { width: 92px; flex: none; font-size: 12px; font-weight: 600; overflow: hidden; white-space: nowrap; padding-right: 4px; display: flex; align-items: center; gap: 4px }
.tlName.isLate { color: var(--red) }
.tlName.isGrey { color: var(--pmuted) }
.tlName .mk { position: static; width: 10px; height: 10px; flex: none }
.tlTrack { position: relative; flex: 1; height: 100% }
.tlBar { position: absolute; top: 8px; height: 18px; color: var(--c) }
.tlPale { position: absolute; inset: 0; border-radius: 5px; background: var(--c); opacity: .35 }
.tlDark { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--c) }
.tlEnd { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; border-radius: 0 5px 5px 0; background: var(--red) }
.tlTick { position: absolute; right: -15px; top: 1px; color: var(--c); display: grid }
.tlTick svg { width: 14px; height: 14px; stroke-width: 3 }
.tlToday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); pointer-events: none; z-index: 2 }
.tlBtns { position: absolute; left: 12px; right: 12px; bottom: 112px; display: flex; align-items: center; gap: 6px; z-index: 10 }
.pill { border: 1.4px solid var(--teal); color: var(--teal); background: none; border-radius: 16px; min-height: 32px; padding: 0 14px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px }
.pill.red { border-color: var(--red); color: #fff; background: var(--red); padding: 0 10px }
.pill svg { width: 16px; height: 16px }

/* Send page and PARAGON */
.ch { display: flex; gap: 10px; align-items: flex-start; width: 100%; background: var(--pcard); padding: 9px 12px; text-align: left; cursor: pointer; border-radius: 12px; margin-bottom: 6px; border: 1.5px solid var(--pline) }
.ch.on { border-color: var(--para) }
.rd { width: 20px; height: 20px; border-radius: 50%; border: 1.8px solid var(--pmuted); flex: none; margin-top: 1px; display: grid; place-items: center }
.ch.on .rd { border-color: var(--para) }
.ch.on .rd::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--para) }
.ch b { display: block; font-size: 15px }
.ch small { color: var(--pmuted); font-size: 12px }
.fld { width: 100%; min-height: 40px; border-radius: 10px; border: 1px solid var(--pline); background: var(--pcard); padding: 0 12px; font-size: 16px; display: flex; align-items: center }
.wbox { height: 168px; overflow: auto; border: 1px solid var(--pline); border-radius: 10px; background: var(--pcard); padding: 8px 10px; font-size: 13px }
.wl { display: flex; gap: 8px; align-items: center; padding: 3px 0 }
.tkb { width: 15px; height: 15px; border: 1.6px solid var(--para); border-radius: 4px; flex: none; display: grid; place-items: center; color: #fff }
.tkb svg { width: 11px; height: 11px; stroke-width: 3.2 }
.wl.isTicked .tkb { background: var(--para) }

const stage = document.getElementById('stage');
let holdT = null, held = false;
stage.addEventListener('pointerdown', ev => {
  held = false; if (ev.button !== 0) return; const el = ev.target.closest('[data-hold]'); if (!el) return;
  holdT = setTimeout(() => { held = true; openQA(); }, 520);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(n => stage.addEventListener(n, () => clearTimeout(holdT)));
stage.addEventListener('contextmenu', ev => { if (!ev.target.closest('[data-hold]')) return; ev.preventDefault(); clearTimeout(holdT); if (!held) openQA(); });

stage.addEventListener('keydown', ev => {
  if (!ev.target.dataset || ev.target.dataset.in !== 'idea') return;
  if (ev.key === 'Enter') { const t = S.mm.newText.trim(), it = S.mm.items.find(x => x.n === S.mm.adding); if (!t || !it) return; ev.preventDefault();
    it.kids.push(t); S.mm.adding = null; S.mm.newText = ''; S.mm.sel = t; renderStage(); emit('idea-added', t); }
  else if (ev.key === 'Escape') { S.mm.adding = null; S.mm.newText = ''; ev.stopPropagation(); renderStage(); }

stage.addEventListener('click', ev => {

  if (!el) { let ch = false; if (S.menu) { S.menu = false; ch = true; } if (S.qa.open) { S.qa.open = false; ch = true; } if (ch) renderStage(); return; }

function catchUp() {
  const T = S.tl, old = Math.max(...T.bars.map(b => b.e)); T.undo = JSON.parse(JSON.stringify(T.bars)); const moved = new Set();
  T.bars.forEach(b => { if (isLate(b)) { b.e = T.today; moved.add(b.id); } });
  T.bars.forEach(b => { const p = T.bars.find(x => x.id === b.after); if (p && !b.done && b.s <= p.e) { const d = p.e + 1 - b.s; b.s += d; b.e += d; moved.add(b.id); } });
  const end = Math.max(...T.bars.map(b => b.e));
  toast(`${moved.size} bars moved. The plan now ends ${fmt(end)} (was ${fmt(old)}).`, '', '', 5000); emit('catchup', moved.size);
}
function act(a, id, el) {
  switch (a) {
    case 'soon': case 'app-tap': soon(); break;
    case 'open-board': openBoard(id); break;
    case 'back': S.screen = 'list'; S.menu = false; renderStage(); break;
    case 'plus': S.sheet = 'starters'; renderStage(); emit('starters'); break;
    case 'sheet-cancel': S.sheet = null; renderStage(); break;
    case 'st-pick': if (id === 'st-mind') { S.sheet = null; S.screen = 'board'; S.bt = 'mind'; S.bname = 'Mind map'; S.mm = mkMM({ items: [] }); renderStage(); emit('starter', id); }

      else toast('Practice copy: this starter is not drawn here. Mind map and Timeline are.'); break;
    case 'more': S.menu = !S.menu; renderStage(); emit('more'); break;
    case 'm-share': S.menu = false; S.sheet = 'plate'; S.plate = { as: 'Picture' }; renderStage(); emit('plate'); break;
    case 'plate-as': S.plate.as = id; renderStage(); emit('as', id); break;
    case 'plate-share': toast('The device’s own share choice opens here: AirDrop, Mail, Messages, Save to Files and the rest.', '', '', 3600); emit('shared-out', S.plate.as); break;
    case 'send-open': S.sheet = 'send'; S.menu = false; renderStage(); emit('send-open'); break;
    case 'ch': S.send.mode = id; renderStage(); emit('mode', id); break;
    case 'send-go': { const m = S.send.mode; S.sent = mkSent(m); S.sheet = null; S.dock = true;
      const nm = S.bname, n = S.sent.tasks.length;
      toast(m === 'inbox' ? `${n} tasks are on the way to the PARAGON Inbox. They appear there when you switch to PARAGON.` : `“${nm}” is in PARAGON under ${m === 'project' ? 'Projects' : 'Resources'}.`, 'purple', m === 'inbox' ? '' : 'Open', 6000);

      else if (S.screen === 'paragon') { S.screen = 'board'; S.bt = 'tl'; S.bname = 'Summer cabin timeline'; renderStage(); } break;

    case 'tl-done': { const b = S.tl.bars.find(x => x.id === S.tl.sel); if (!b) break; b.done = !b.done; renderStage(); if (b.done) emit('tl-done', b.name); break; }

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('seedboardtour-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (st.on && st.on[name]) { markTarget(st.on[name]); }
  if ((st.wait === name || st.alt === name) && (!st.when || st.when(data))) succeed(st.ok);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '✓ ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to tap is out of sight (a stray tap closed a page), point at the way back to it.
  const first = LESSONS[ci] && LESSONS[ci].steps[si] && LESSONS[ci].steps[si].target;
  const el = q(curTarget) || (first && first !== curTarget ? q(first) : null) || (S.sheet ? q('sheet-cancel') : S.screen === 'board' ? q('back-btn') : null);
  if (el) {
    el.classList.add('target');
    const sc = el.closest('.scr');
    if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(), k = document.getElementById('stagebox').clientWidth / 390;
      if (r.top < s.top + 40 * k || r.bottom > s.bottom - 110 * k) sc.scrollTop += (r.top - s.top - 120 * k) / k; }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="logo">${icon('sprout')}</span><div><h1>Seedboard Tour</h1><small>Learn the app in about 15 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '✓' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('todo')}<span>Now on your iPhone</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Practice copy, nothing changes on your phone. Based on AMS Seedboard 0.6.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) { ci = i; si = 0; S = START(); renderStep(); }
function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  clearTimeout(toastT.h); held = false;
  S = START(); if (st.setup) st.setup();
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">· ${kindName} · step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('seedboardtour-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { ci--; si = LESSONS[ci].steps.length - 1; renderStep(); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  S = START(); curTarget = null; renderStage();
  const items = ['Open Seedboard on your iPhone. Find the list (Pinned, Recent, Sent to PARAGON), the field "Search boards", the round green + and the version 0.6 in the last line.',
    'Press the green +, pick Mind map, type a middle idea, press Return for a branch and Tab for an idea under it. Look at where the words sit on the line.',
    'Choose an idea and press To do. The hollow purple ring appears at its corner.',
    'Press the green +, pick Timeline. Choose a bar and press Done. Check the line at the top, for example "3 of 8 done · 1 late · ends 20 Feb". If a bar is late, press the red Catch up.',
    'Send the timeline to PARAGON as a project. Switch to PARAGON and check that the bar you marked Done is already ticked, with its words struck through. The box "What PARAGON gets" counts it, for example "5 tasks (1 done)".',
    'Send only the to-do boxes and switch to PARAGON. The to-dos are in the Inbox. A bar that is done is not there.',
    'In another app press Share, choose Seedboard, pick a board and press Send. Open Seedboard: the words, the link or the picture are on that board.',
    'In a board press the … button, then Share…. Choose PDF and press Share.',
    'Press and hold the Seedboard icon on your Home Screen. Check the four lines: New board, New board from the clipboard and your two pinned boards.'];
  let ticks = JSON.parse(store.get('seedboardtour-real') || '[]');
  fin.innerHTML = `<h3>Now on your iPhone</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('seedboardtour-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.sheet || S.menu || S.qa.open)) { S.sheet = null; S.menu = false; S.qa.open = false; renderStage(); return; }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
